[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sivia-modelatlas"
version = "0.3.0"
description = "Paper to overview with a verified MCM/ICM illustration knowledge base"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pypdf>=4,<7", "requests>=2.31,<3", "Pillow>=9,<13"]

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]
dev = ["pytest>=8,<9", "build>=1,<2"]

[project.scripts]
modelatlas = "modelatlas.cli:main"
modelatlas-mcp = "modelatlas.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modelatlas = ["knowledge/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
