[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sivia-modelatlas"
version = "0.1.0"
description = "SIVIA companion for MCM/ICM modeling diagrams and reproducible data figures"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.24,<3", "matplotlib>=3.7,<4", "pypdf>=4,<7", "requests>=2.31,<3"]

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]
dev = ["pytest>=8,<9", "build>=1,<2"]

[project.scripts]
modelatlas = "modelatlas.cli:main"
modelatlas-mcp = "modelatlas.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modelatlas = ["knowledge/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
